name: Check nieuwe Guruji tweets en stuur naar Instapaper

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

concurrency:
  group: check-new-tweets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Repo uitchecken
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Debug env
        env:
          PAGES_BASE_URL: https://gagenr.github.io/bhakti-marga-automation
        run: echo "PAGES_BASE_URL is $PAGES_BASE_URL"

      - name: Script draaien
        env:
          INSTAPAPER_USERNAME: ${{ secrets.INSTAPAPER_USERNAME }}
          INSTAPAPER_PASSWORD: ${{ secrets.INSTAPAPER_PASSWORD }}
          PAGES_BASE_URL: https://gagenr.github.io/bhakti-marga-automation
        run: python scripts/telegram_to_instapaper.py

      - name: Wijzigingen terug committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/tweets
          git add state/seen_ids.json docs/tweets/
          git diff --staged --quiet || git commit -m "Update"
          git pull --rebase origin main
          git push