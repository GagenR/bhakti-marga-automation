<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guruji — Bhakti Marga</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #666666;
    --accent: #8a4b2f;
    --border: #e5e0da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --text: #eaeaea;
      --muted: #999999;
      --accent: #c98a5e;
      --border: #333333;
    }
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
  }
  body {
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.6;
    max-width: 40em;
    margin: 0 auto;
    padding: 2em 1.2em 3em;
  }
  .label {
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-size: 0.75em;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.3em;
  }
  h1 {
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-size: 1.3em;
    margin: 0 0 0.4em;
  }
  .posted-at {
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-size: 0.85em;
    color: var(--muted);
    margin: 0 0 1.2em;
    padding-bottom: 0.8em;
    border-bottom: 1px solid var(--border);
  }
  .tweet-photo {
    width: 100%;
    height: auto;
    border-radius: 6px;
    margin: 0 0 1.5em;
    display: block;
  }
  .tweet-text {
    font-size: 1.25em;
    white-space: pre-wrap;
    margin: 0 0 2em;
  }
  .meta {
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-size: 0.85em;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 1em;
  }
  .meta a {
    color: var(--accent);
    text-decoration: none;
  }
</style>
</head>
